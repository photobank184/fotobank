{% extends 'base.html' %}

{% block title %}
Sign In | PhotoBank
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-5 col-md-7">

            <div class="card shadow-sm border-0 rounded-4 mt-5 p-5">

                <div class="text-center mb-4">

                    <div class="display-6 mb-3">
                        <i class="bi bi-camera-fill"></i>
                    </div>

                    <h2 class="fw-bold mb-2">
                        Welcome Back
                    </h2>

                    <p class="text-muted mb-0">
                        Sign in to your PhotoBank account.
                    </p>

                </div>

                <form method="post">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        {{ form.username }}

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Password
                        </label>

                        {{ form.password }}

                    </div>

                    <button
                        type="submit"
                        class="btn btn-dark w-100 rounded-pill py-3 fw-semibold"
                    >
                        Sign In
                    </button>

                </form>

                <hr class="my-4">

                <div class="text-center">

                    <small class="text-muted">

                        Want to sell your photos?

                    </small>

                    <div class="mt-3">

                        <a
                            href="{% url 'gallery:dashboard' %}"
                            class="btn btn-primary rounded-pill px-4"
                        >
                            Become a Contributor
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
