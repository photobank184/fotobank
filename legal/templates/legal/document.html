{% extends "base.html" %}

{% block content %}
<main class="container py-5 mt-5">
  <div class="row justify-content-center py-5">
    <article class="col-lg-9">

      <a href="{% url 'legal:index' %}"
         class="text-decoration-none d-inline-flex align-items-center gap-2 mb-4">
        <i class="bi bi-arrow-left"></i>
        Legal Center
      </a>

      <header class="mb-5">
        <p class="text-uppercase fw-semibold text-secondary mb-2">
          PhotoBank legal document
        </p>

        <h1 class="display-5 fw-bold mb-3">
          {% block document_heading %}{% endblock %}
        </h1>

        <div class="text-secondary">
          <span>Version 1.0</span>
          <span class="mx-2">·</span>
          <span>Effective date: To be confirmed</span>
        </div>
      </header>

      <div class="legal-document">
        {% block legal_content %}{% endblock %}
      </div>

    </article>
  </div>
</main>
{% endblock %}
